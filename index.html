<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hitarth & Chitra</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- ONE SINGLE DIV -->
  <div class="invite">

    <!-- Level 4: Background (repeat) -->
    <div class="bg"></div>

    <!-- Level 3: Borders (above bg) -->
    <img class="layer border left-border" src="images/left_border.png" alt="Left Border" />
    <img class="layer border right-border" src="images/right_border.png" alt="Right Border" />
    <img class="layer border bottom-border" src="images/bottom_border.png" alt="Bottom Border" />

    <!-- Level 2: Shivji + flowers + garlands (below arch, overlap) -->
    <img class="layer lvl2 shivji" src="images/top_shivji.avif" alt="Shivji" />

    <img class="layer lvl2 left-flower" src="images/left_top_flower.avif" alt="Left Flower" />
    <img class="layer lvl2 right-flower" src="images/right_top_flower.avif" alt="Right Flower" />

    <img class="layer lvl2 left-garland" src="images/left_top_garland.avif" alt="Left Garland" />
    <img class="layer lvl2 right-garland" src="images/right_top_garland.avif" alt="Right Garland" />

    <!-- Level 1: Arch (topmost) -->
    <img class="layer lvl1 arch" src="images/top_arch.avif" alt="Top Arch" />

  </div>

</body>
</html>
