<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hitarth & Chitra</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,700;1,400;1,700&family=Gotu&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

  <div class="invite" id="invite">

    <!-- Background -->
    <div class="bg"></div>

    <!-- Level 1 -->
    <img id="arch" class="layer arch" src="images/top_arch.avif" alt="Top Arch" />
    <img class="layer left-border" src="images/left_border.png" alt="Left Border" />
    <img class="layer right-border" src="images/right_border.png" alt="Right Border" />

    <!-- Level 2 (auto positioned by JS) -->
    <div id="level2" class="level2">
      <img class="layer2 shivji" src="images/top_shivji.avif" alt="Shivji" />

      <img class="layer2 left-garland" src="images/left_top_garland.avif" alt="Left Garland" />
      <img class="layer2 right-garland" src="images/right_top_garland.avif" alt="Right Garland" />

      <img class="layer2 left-flower" src="images/left_top_flower.avif" alt="Left Flower" />
      <img class="layer2 right-flower" src="images/right_top_flower.avif" alt="Right Flower" />
    </div>

    <!-- Level 3 -->
    <img class="layer bottom-border" src="images/bottom_border.png" alt="Bottom Border" />

  </div>

  <script src="script.js"></script>
</body>
</html>
