<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hitarth & Chitra</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- ONE DIV ONLY -->
  <div class="invite">

    <!-- Background (last layer, repeating full page) -->
    <div class="bg"></div>

    <!-- Level 1: Arch + Borders (together from top) -->
    <img class="layer arch" src="images/top_arch.avif" alt="Top Arch" />
    <img class="layer left-border" src="images/left_border.png" alt="Left Border" />
    <img class="layer right-border" src="images/right_border.png" alt="Right Border" />

    <!-- Level 2: Shivji + flowers + garlands (below arch, overlap) -->
    <img class="layer shivji" src="images/top_shivji.avif" alt="Shivji" />

    <img class="layer left-garland" src="images/left_top_garland.avif" alt="Left Garland" />
    <img class="layer right-garland" src="images/right_top_garland.avif" alt="Right Garland" />

    <img class="layer left-flower" src="images/left_top_flower.avif" alt="Left Flower" />
    <img class="layer right-flower" src="images/right_top_flower.avif" alt="Right Flower" />

    <!-- Level 3: Bottom border -->
    <img class="layer bottom-border" src="images/bottom_border.png" alt="Bottom Border" />

  </div>

</body>
</html>
