<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hitarth & Chitra | Wedding Invite</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- HERO SECTION -->
  <header class="hero">

    <!-- Background -->
    <img class="layer bg" src="images/background.png" alt="Background" />

    <!-- Decorative layers -->
    <img class="layer top-arch" src="images/top_arch.png" alt="Top Arch" />

    <img class="layer left-border" src="images/left_border.png" alt="Left Border" />
    <img class="layer right-border" src="images/right_border.png" alt="Right Border" />
    <img class="layer bottom-border" src="images/bottom_border.png" alt="Bottom Border" />

    <img class="layer moon" src="images/moon.png" alt="Moon" />
    <img class="layer om" src="images/om.png" alt="Om" />

    <img class="layer left-ganpati" src="images/left_ganpati.png" alt="Left Ganpati" />
    <img class="layer right-ganpati" src="images/right_ganpati.png" alt="Right Ganpati" />

    <img class="layer left-tree" src="images/left_tree.png" alt="Left Tree" />
    <img class="layer right-tree" src="images/right_tree.png" alt="Right Tree" />

    <img class="layer centre-prop" src="images/centre_prop.png" alt="Center Decor" />

    <!-- Text -->
    <div class="hero-text">
      <h1>Hitarth</h1>
      <p class="wed-text">WEDS</p>
      <h1>Chitra</h1>

      <a class="btn" href="#details">View Details</a>
    </div>

  </header>

  <!-- DETAILS SECTION -->
  <main id="details" class="container">
    <section class="card">
      <h2>Wedding Details</h2>
      <p><b>Date:</b> Coming Soon</p>
      <p><b>Venue:</b> Coming Soon</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
